server {
    listen 127.0.0.1:18052;
    server_name www.gdpeso.xyz;
    include /etc/nginx/snippets/gdpeso-static.conf;
}

server {
    listen 80;
    server_name www.gdpeso.xyz;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/gdpeso-acme;
        try_files $uri =404;
    }
    location / {
        return 301 https://www.gdpeso.xyz$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.gdpeso.xyz;
    ssl_certificate /etc/letsencrypt/live/www.gdpeso.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.gdpeso.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/snippets/gdpeso-static.conf;
}
