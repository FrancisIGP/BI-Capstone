root /home/ubuntu/2026_3dsa_4_GDPeso/current/site;
index index.html;

location = /index.html {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
}

location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

location / {
    try_files $uri $uri/ /index.html;
}
