server {
    listen 127.0.0.1:18052;
    server_name www.gdpeso.xyz;
    include /etc/nginx/snippets/gdpeso-static.conf;
}

server {
    listen 80;
    server_name www.gdpeso.xyz;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/gdpeso-acme;
        try_files $uri =404;
    }
    include /etc/nginx/snippets/gdpeso-static.conf;
}
